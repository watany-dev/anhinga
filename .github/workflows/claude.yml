name: Claude Assistant
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude-code-action:
    # NOTE: gate on the *commenter*, not the issue author (see claude-cli.yml).
    if: >
      github.event.comment.user.login == 'watany-dev' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_BEDROCK_BASE_URL: "https://bedrock-runtime.us-west-2.amazonaws.com"
      ANTHROPIC_MODEL: "us.anthropic.claude-sonnet-4-20250514-v1:0"
    permissions:
      id-token: write
      contents: read
      # the action posts its progress/answer as a comment, which needs write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # For AWS Bedrock with OIDC
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      # `@beta` no longer exists upstream; v1 takes the model via ANTHROPIC_MODEL
      # rather than a `model` input.
      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        with:
          use_bedrock: "true"
